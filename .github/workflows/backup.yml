# CURRENTLY OFF — do not re-enable the artifact upload in this repository.
# This repository is public. Workflow artifacts in a public repository can
# be downloaded by anyone with read access, i.e. any signed-in GitHub user,
# so a database dump must never be uploaded as an artifact here.
# The server-side backup steps are kept; the download/upload steps are
# commented out (not deleted). The job only runs on a manual dispatch when
# the repository variable CHRONOS_ACTIONS_ENABLED is 'true' (unset today).
# Planned replacement: encrypted backups to private object storage — see
# docs/AVAILABILITY-AND-DR.md.
# ─────────────────────────────────────────────────────────────────
name: Weekly Backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Full WordPress Backup (DB + Uploads)
    runs-on: ubuntu-latest
    if: ${{ vars.CHRONOS_ACTIONS_ENABLED == 'true' }}

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/chronos_gcp
          chmod 600 ~/.ssh/chronos_gcp
          ssh-keyscan -H ${{ secrets.GCP_HOST }} >> ~/.ssh/known_hosts

      - name: Create backup on GCP server
        env:
          GCP_HOST: ${{ secrets.GCP_HOST }}
        run: |
          ssh -i ~/.ssh/chronos_gcp -o StrictHostKeyChecking=no ubuntu@${GCP_HOST} << 'ENDSSH'
            set -e
            BACKUP_DIR="/home/ubuntu/backups"
            DATE=$(date +%Y-%m-%d)
            mkdir -p "$BACKUP_DIR"

            echo "--- Backing up database ---"
            sudo wp db export "$BACKUP_DIR/db_${DATE}.sql" \
              --path=/var/www/chronos --allow-root
            gzip -f "$BACKUP_DIR/db_${DATE}.sql"

            echo "--- Backing up uploads ---"
            sudo tar -czf "$BACKUP_DIR/uploads_${DATE}.tar.gz" \
              -C /var/www/chronos/wp-content uploads/

            echo "--- Rotating: keeping 2 most recent backups ---"
            ls -t "$BACKUP_DIR"/db_*.sql.gz 2>/dev/null | tail -n +3 | xargs -r rm -f
            ls -t "$BACKUP_DIR"/uploads_*.tar.gz 2>/dev/null | tail -n +3 | xargs -r rm -f

            echo "--- Current backups on server ---"
            ls -lh "$BACKUP_DIR"/
          ENDSSH

      # Off-server copy disabled for the public repository (see header).
      # - name: Download backups to runner
        # env:
          # GCP_HOST: ${{ secrets.GCP_HOST }}
        # run: |
          # DATE=$(date +%Y-%m-%d)
          # scp -i ~/.ssh/chronos_gcp -o StrictHostKeyChecking=no \
            # ubuntu@${GCP_HOST}:/home/ubuntu/backups/db_${DATE}.sql.gz \
            # ./chronos-db-${DATE}.sql.gz
          # scp -i ~/.ssh/chronos_gcp -o StrictHostKeyChecking=no \
            # ubuntu@${GCP_HOST}:/home/ubuntu/backups/uploads_${DATE}.tar.gz \
            # ./chronos-uploads-${DATE}.tar.gz

