name: Inventory automation

on:
  pull_request:
    paths: ['integrations/inventory/**', 'integrations/meta-ads/requirements-dev.lock', '.github/workflows/inventory.yml']
  push:
    branches: [main]
    paths: ['integrations/inventory/**', 'integrations/meta-ads/requirements-dev.lock', '.github/workflows/inventory.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/inventory
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked dependencies and verification tools
        run: |
          python -m pip install --require-hashes -r ../meta-ads/requirements-dev.lock
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps .
      - name: Behavioral and configuration regressions
        run: python -m pytest ci_tests -q
      - name: Types and lint
        run: |
          python -m mypy src
          python -m ruff check src ci_tests build_workflow.py
      - name: Security and dependency audit
        run: |
          python -m bandit -r src
          python -m pip_audit -r requirements.lock
      - name: Build distributable
        run: python -m build
