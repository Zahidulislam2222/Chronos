name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── PHP Lint & Tests (chronos-bridge) ──────────────────────────
  php-tests:
    name: PHP Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, curl, zip
          tools: composer:v2

      - name: Install Composer dependencies
        working-directory: wordpress/wp-content/plugins/chronos-bridge
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPCS
        working-directory: wordpress/wp-content/plugins/chronos-bridge
        run: vendor/bin/phpcs --standard=phpcs.xml --report=summary --warning-severity=0

      - name: Run PHPUnit
        working-directory: wordpress/wp-content/plugins/chronos-bridge
        run: vendor/bin/phpunit --testdox

  # ── JS Lint, Build & Tests (chronos-blocks) ───────────────────
  blocks-tests:
    name: Blocks Build & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: wordpress/wp-content/plugins/chronos-blocks/package-lock.json

      - name: Install dependencies
        working-directory: wordpress/wp-content/plugins/chronos-blocks
        run: npm ci

      - name: Build blocks
        working-directory: wordpress/wp-content/plugins/chronos-blocks
        run: npm run build

      - name: Run Jest tests
        working-directory: wordpress/wp-content/plugins/chronos-blocks
        run: npm test

  # ── Frontend Build (React + Vite) ─────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  # ── Deploy to Production — cPanel API (LEGACY / PROOF OF WORK) ──
  # This job was the original AridHost cPanel deployment pipeline.
  # Kept intact as a portfolio artifact showing cPanel API integration.
  # Muted with if: false — AridHost hosting expired 2026-05.
  deploy-cpanel-legacy:
    name: Deploy via cPanel (Legacy — Muted)
    needs: [php-tests, blocks-tests, frontend-build]
    if: false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          pip install requests

      - name: Build frontend
        env:
          VITE_API_URL: https://chronosbackend.healthcodeanalysis.com/graphql
        run: npm run build

      - name: Deploy backend plugins + frontend via cPanel API
        env:
          CPANEL_URL: ${{ secrets.CPANEL_URL }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: python scripts/ci-deploy.py

      - name: Verify deployment
        run: |
          echo "Verifying backend..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://chronosbackend.healthcodeanalysis.com/wp-json/chronos/v1/" || echo "000")
          echo "Backend: HTTP $STATUS"
          echo ""
          echo "Verifying frontend..."
          FSTATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://chronos.healthcodeanalysis.com/" || echo "000")
          echo "Frontend: HTTP $FSTATUS"

  # ── Deploy Backend Plugins to GCP (SSH + rsync) ──────────────────
  deploy-gcp:
    name: Deploy Backend to GCP
    needs: [php-tests, blocks-tests, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/chronos_gcp
          chmod 600 ~/.ssh/chronos_gcp
          ssh-keyscan -H ${{ secrets.GCP_HOST }} >> ~/.ssh/known_hosts

      - name: Sync custom plugins to GCP
        env:
          GCP_HOST: ${{ secrets.GCP_HOST }}
        run: |
          WP_PLUGINS="ubuntu@${GCP_HOST}:/var/www/chronos/wp-content/plugins"
          SSH_OPT="-i ~/.ssh/chronos_gcp -o StrictHostKeyChecking=no"

          rsync -az -e "ssh ${SSH_OPT}" --delete \
            wordpress/wp-content/plugins/chronos-bridge/ \
            ${WP_PLUGINS}/chronos-bridge/

          rsync -az -e "ssh ${SSH_OPT}" --delete \
            wordpress/wp-content/plugins/chronos-blocks/ \
            ${WP_PLUGINS}/chronos-blocks/

          rsync -az -e "ssh ${SSH_OPT}" --delete \
            wordpress/wp-content/plugins/wp-graphql-cors-master/ \
            ${WP_PLUGINS}/wp-graphql-cors-master/

      - name: Fix permissions and flush cache
        env:
          GCP_HOST: ${{ secrets.GCP_HOST }}
        run: |
          ssh -i ~/.ssh/chronos_gcp -o StrictHostKeyChecking=no ubuntu@${GCP_HOST} \
            "sudo chown -R www-data:www-data /var/www/chronos/wp-content/plugins \
             && cd /var/www/chronos \
             && wp cache flush --allow-root 2>/dev/null || true \
             && wp rewrite flush --allow-root 2>/dev/null || true \
             && echo 'GCP deploy complete.'"

  # ── Deploy Frontend to Cloudflare Pages ──────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Cloudflare Pages
    needs: [php-tests, blocks-tests, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: https://chronosbackend.healthcodeanalysis.com/graphql
        run: npm run build

      - name: Refresh Cloudflare token
        env:
          CF_REFRESH_TOKEN: ${{ secrets.CF_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          RESPONSE=$(curl -s -X POST "https://dash.cloudflare.com/oauth2/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=refresh_token&refresh_token=${CF_REFRESH_TOKEN}&client_id=54d11594-84e4-41aa-b438-e81b8fa78ee7")

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          NEW_REFRESH=$(echo "$RESPONSE" | jq -r '.refresh_token')

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "Token refresh failed: $RESPONSE" && exit 1
          fi

          echo "$NEW_REFRESH" | gh secret set CF_REFRESH_TOKEN --repo Zahidulislam2222/Chronos
          echo "CF_ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLOUDFLARE_API_TOKEN="$CF_ACCESS_TOKEN" \
            npx wrangler pages deploy dist --project-name chronos --branch main

  # ── Verify Full Stack After Deploy ───────────────────────────────
  verify:
    name: Verify Deployment
    needs: [deploy-gcp, deploy-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check backend GraphQL
        run: |
          echo "Checking backend GraphQL..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            -X POST https://chronosbackend.healthcodeanalysis.com/graphql \
            -H "Content-Type: application/json" \
            -d '{"query":"{products{nodes{name}}}"}' || echo "000")
          echo "GraphQL: HTTP $STATUS"
          [ "$STATUS" = "200" ] || (echo "Backend check failed!" && exit 1)

      - name: Check frontend
        run: |
          echo "Checking frontend..."
          FSTATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            "https://chronos.healthcodeanalysis.com/" || echo "000")
          echo "Frontend: HTTP $FSTATUS"
          [ "$FSTATUS" = "200" ] || (echo "Frontend check failed!" && exit 1)
