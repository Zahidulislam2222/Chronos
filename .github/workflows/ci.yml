name: CI Pipeline

# Quality gates (PHP, blocks, frontend) run on every push to main and every
# pull request. They need no secrets, so forks can run them safely.
# Deployment jobs below stay manual and opt-in — see the notes on each job.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── PHP Lint & Tests (chronos-bridge) ──────────────────────────
  php-tests:
    name: PHP Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, curl, zip
          tools: composer:v2

      - name: Install Composer dependencies
        working-directory: wordpress/wp-content/plugins/chronos-bridge
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPCS
        working-directory: wordpress/wp-content/plugins/chronos-bridge
        run: vendor/bin/phpcs --standard=phpcs.xml --report=summary --warning-severity=0

      - name: Run PHPUnit
        working-directory: wordpress/wp-content/plugins/chronos-bridge
        run: vendor/bin/phpunit --testdox

  # ── JS Lint, Build & Tests (chronos-blocks) ───────────────────
  blocks-tests:
    name: Blocks Build & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: wordpress/wp-content/plugins/chronos-blocks/package-lock.json

      - name: Install dependencies
        working-directory: wordpress/wp-content/plugins/chronos-blocks
        run: npm ci

      - name: Build blocks
        working-directory: wordpress/wp-content/plugins/chronos-blocks
        run: npm run lint:js && npm run build

      - name: Run Jest tests
        working-directory: wordpress/wp-content/plugins/chronos-blocks
        run: npm test

  # ── Frontend Build (React + Vite) ─────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit and validate frontend
        run: npm audit --audit-level=moderate && npm run typecheck && npm run lint

      - name: Install rendering browser
        run: npx playwright install --with-deps chromium

      - name: Build rendered portfolio
        env:
          VITE_API_URL: ''
          VITE_WP_API_URL: ''
          VITE_SITE_URL: ${{ vars.CHRONOS_SITE_URL || 'https://chronos.example' }}
          VITE_STOREFRONT_MODE: preview
          VITE_SEARCH_INDEXABLE: 'true'
        run: npm run build && npm run verify:release

  # ── Deploy to Production — cPanel API (RETIRED, CURRENTLY OFF) ──
  # This was the original production pipeline on AridHost cPanel. It worked
  # end-to-end in production (cPanel UAPI Git pull + Fileman upload) until
  # the cPanel hosting expired in May 2026. The project now runs on VPS
  # hosting (frontend VPS + GCP backend VM). The code is kept intact as a
  # reference; `if: false` switches the job off so it can never run or fail.
  deploy-cpanel-legacy:
    name: Deploy via cPanel (Retired — Off)
    needs: [php-tests, blocks-tests, frontend-build]
    if: ${{ false }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          pip install requests

      - name: Build frontend
        env:
          VITE_API_URL: https://chronosbackend.healthcodeanalysis.com/graphql
        run: npm run build:client

      - name: Deploy backend plugins + frontend via cPanel API
        env:
          CPANEL_URL: ${{ secrets.CPANEL_URL }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: python scripts/ci-deploy.py

      - name: Verify deployment
        run: |
          echo "Verifying backend..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://chronosbackend.healthcodeanalysis.com/wp-json/chronos/v1/" || echo "000")
          echo "Backend: HTTP $STATUS"
          echo ""
          echo "Verifying frontend..."
          FSTATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://chronos.healthcodeanalysis.com/" || echo "000")
          echo "Frontend: HTTP $FSTATUS"

  # ── Deploy Backend Plugins to GCP (SSH + rsync) ──────────────────
  # Opt-in only: runs on a manual dispatch from main when the repository
  # variable CHRONOS_ACTIONS_ENABLED is 'true'. Current releases are
  # promoted manually with local-vs-live SHA-256 parity checks, so this
  # variable is intentionally unset and the job is skipped by default.
  deploy-gcp:
    name: Deploy Backend to GCP
    needs: [php-tests, blocks-tests, frontend-build]
    if: ${{ vars.CHRONOS_ACTIONS_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/chronos_gcp
          chmod 600 ~/.ssh/chronos_gcp
          ssh-keyscan -H ${{ secrets.GCP_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare plugin directories
        env:
          GCP_HOST: ${{ secrets.GCP_HOST }}
        run: |
          ssh -i ~/.ssh/chronos_gcp -o StrictHostKeyChecking=no ubuntu@${GCP_HOST} \
            "sudo chown -R ubuntu:ubuntu \
              /var/www/chronos/wp-content/plugins/chronos-bridge \
              /var/www/chronos/wp-content/plugins/chronos-blocks \
              /var/www/chronos/wp-content/plugins/wp-graphql-cors-master"

      - name: Sync custom plugins to GCP
        env:
          GCP_HOST: ${{ secrets.GCP_HOST }}
        run: |
          WP_PLUGINS="ubuntu@${GCP_HOST}:/var/www/chronos/wp-content/plugins"
          SSH_OPT="-i ~/.ssh/chronos_gcp -o StrictHostKeyChecking=no"

          rsync -rltz --delete --exclude=vendor/ -e "ssh ${SSH_OPT}" \
            wordpress/wp-content/plugins/chronos-bridge/ \
            ${WP_PLUGINS}/chronos-bridge/

          rsync -rltz --delete --exclude=vendor/ -e "ssh ${SSH_OPT}" \
            wordpress/wp-content/plugins/chronos-blocks/ \
            ${WP_PLUGINS}/chronos-blocks/

          rsync -rltz --delete --exclude=vendor/ -e "ssh ${SSH_OPT}" \
            wordpress/wp-content/plugins/wp-graphql-cors-master/ \
            ${WP_PLUGINS}/wp-graphql-cors-master/

      - name: Fix permissions and flush cache
        env:
          GCP_HOST: ${{ secrets.GCP_HOST }}
        run: |
          ssh -i ~/.ssh/chronos_gcp -o StrictHostKeyChecking=no ubuntu@${GCP_HOST} \
            "sudo chown -R www-data:www-data /var/www/chronos/wp-content/plugins \
             && cd /var/www/chronos \
             && wp cache flush --allow-root 2>/dev/null || true \
             && wp rewrite flush --allow-root 2>/dev/null || true \
             && echo 'GCP deploy complete.'"

  # ── Deploy Frontend to Cloudflare Pages (SUPERSEDED, CURRENTLY OFF) ──
  # Worked as the interim frontend host (May to Sep 2026). The public frontend
  # moved to a versioned VPS release at https://chronos.zahidul-islam.com,
  # deployed with the process in deploy/shared-vps/. Kept for reference;
  # `if: false` switches it off.
  deploy-frontend:
    name: Deploy Frontend to Cloudflare Pages (Superseded — Off)
    needs: [php-tests, blocks-tests, frontend-build]
    if: ${{ false }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: https://chronosbackend.35-222-94-93.sslip.io/graphql
          VITE_WP_API_URL: https://chronosbackend.35-222-94-93.sslip.io
          VITE_SITE_URL: https://chronos-vwg.pages.dev
        run: npm run build:client

      - name: Restore Wrangler credentials
        env:
          CF_WRANGLER_CONFIG: ${{ secrets.CF_WRANGLER_CONFIG }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p ~/.config/.wrangler/config
          printf '%s' "$CF_WRANGLER_CONFIG" > ~/.config/.wrangler/config/default.toml

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist --project-name chronos --branch main

      - name: Rotate Wrangler credentials
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          CONFIG=~/.config/.wrangler/config/default.toml
          if [ -f "$CONFIG" ] && grep -q "refresh_token" "$CONFIG"; then
            cat "$CONFIG" | gh secret set CF_WRANGLER_CONFIG --repo Zahidulislam2222/Chronos
          fi

  # ── Verify Full Stack After Deploy ───────────────────────────────
  verify:
    name: Verify Deployment
    needs: [deploy-gcp]
    if: ${{ vars.CHRONOS_ACTIONS_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check backend GraphQL
        run: |
          echo "Checking backend GraphQL..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            -X POST https://chronosbackend.35-222-94-93.sslip.io/graphql \
            -H "Content-Type: application/json" \
            -d '{"query":"{products{nodes{name}}}"}' || echo "000")
          echo "GraphQL: HTTP $STATUS"
          [ "$STATUS" = "200" ] || (echo "Backend check failed!" && exit 1)

      - name: Check frontend
        run: |
          echo "Checking frontend..."
          FSTATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            "https://chronos.zahidul-islam.com/" || echo "000")
          echo "Frontend: HTTP $FSTATUS"
          [ "$FSTATUS" = "200" ] || (echo "Frontend check failed!" && exit 1)
