name: Security

# Dependency vulnerability audits. They run on pushes to main, on pull
# requests, weekly (Monday 06:00 UTC) and on demand. No secrets are needed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── npm vulnerability audit ────────────────────────────────────
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit root dependencies
        run: npm audit --audit-level=moderate

      - name: Audit blocks dependencies
        working-directory: wordpress/wp-content/plugins/chronos-blocks
        run: npm audit --audit-level=moderate

  # ── Composer vulnerability audit ───────────────────────────────
  composer-audit:
    name: composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Install dependencies
        working-directory: wordpress/wp-content/plugins/chronos-bridge
        run: composer install --no-interaction --prefer-dist

      - name: Audit dependencies
        working-directory: wordpress/wp-content/plugins/chronos-bridge
        run: composer audit

  # Static analysis (CodeQL) runs in .github/workflows/codeql.yml.
