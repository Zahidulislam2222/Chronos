name: chronos-guide
services:
  guide:
    image: ${CHRONOS_GUIDE_NODE_IMAGE:?Set verified local image digest}
    pull_policy: never
    network_mode: host
    user: "1000:1000"
    working_dir: /app
    command: ["node", "scripts/assistant/service.mjs"]
    read_only: true
    restart: unless-stopped
    init: true
    stop_grace_period: ${CHRONOS_GUIDE_STOP_GRACE_SECONDS:?Match maintained shutdown grace}s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      CHRONOS_ASSISTANT_TRUST_PROXY_HEADERS: "true"
      CHRONOS_ASSISTANT_OLLAMA_ORIGIN: ${CHRONOS_GUIDE_OLLAMA_ORIGIN:?Set exact loopback model origin}
      CHRONOS_ASSISTANT_ALLOWED_ORIGINS: ${CHRONOS_GUIDE_PUBLIC_ORIGIN:?Set exact public origin}
      CHRONOS_ASSISTANT_OPENROUTER_ENABLED: ${CHRONOS_GUIDE_REMOTE_ENABLED:?Verify billing/privacy before enabling}
    volumes:
      - ./app:/app:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    labels: {Hub: portfolio-hub, Project: chronos}
  model:
    profiles: [local-model]
    image: ${CHRONOS_GUIDE_OLLAMA_IMAGE:?Set verified local image digest}
    pull_policy: never
    network_mode: host
    user: "1000:1000"
    command: ["serve"]
    read_only: true
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      HOME: /var/lib/ollama
      OLLAMA_HOST: ${CHRONOS_GUIDE_OLLAMA_ORIGIN:?Set exact loopback model origin}
      OLLAMA_MODELS: /var/lib/ollama/models
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: ${CHRONOS_GUIDE_MODEL_CONTEXT:?Match maintained context limit}
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_MAX_QUEUE: "1"
    volumes:
      - ${CHRONOS_GUIDE_MODEL_DIRECTORY:?Set app-owned writable model home}:/var/lib/ollama:rw
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    labels: {Hub: portfolio-hub, Project: chronos}
