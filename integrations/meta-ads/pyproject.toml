[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos-ads"
version = "0.1.0"
description = "Account-scoped Meta advertising tools for Claude and Chronos"
requires-python = ">=3.12"
dependencies = ["mcp==1.30.0", "httpx==0.28.1", "pydantic==2.14.0", "python-dotenv==1.2.4"]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.17.0", "mypy==2.4.0", "bandit==1.9.4", "build==1.6.1", "pip-audit==2.10.1"]

[project.scripts]
chronos-ads = "chronos_ads.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chronos_ads = ["data/*.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/chronos_ads"]

[tool.pytest.ini_options]
testpaths = ["ci_tests"]
pythonpath = ["src"]
