name: chronos-automation
services:
  n8n:
    image: ${N8N_IMAGE:?Pin the verified n8n image}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:?}:${N8N_PORT:?}"
    environment:
      N8N_HOST: localhost
      N8N_PORT: ${N8N_PORT:?}
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: ${N8N_BASE_URL:?}
      WEBHOOK_URL: ${N8N_BASE_URL:?}
      GENERIC_TIMEZONE: ${AUTOMATION_TIMEZONE:?}
      TZ: ${AUTOMATION_TIMEZONE:?}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.readWriteFile","n8n-nodes-base.ssh"]'
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${N8N_EXECUTION_HOURS:?}
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: ${N8N_EXECUTION_COUNT:?}
      N8N_PAYLOAD_SIZE_MAX: ${N8N_PAYLOAD_MB:?}
    volumes:
      - n8n_data:/home/node/.n8n
      - ../workflow.json:/opt/chronos/workflow.json:ro
    mem_limit: ${N8N_MEMORY_LIMIT:?}
    cpus: ${N8N_CPU_LIMIT:?}
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  inventory:
    build:
      context: ..
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?Pin the Python base image}
    restart: unless-stopped
    env_file: ../.env
    environment:
      CHRONOS_INVENTORY_DATABASE: /state/inventory.sqlite3
      CHRONOS_INVENTORY_BIND_HOST: 0.0.0.0
      CHRONOS_INVENTORY_PORT: ${INVENTORY_PORT:?}
    volumes:
      - inventory_data:/state
    ports:
      - "127.0.0.1:${INVENTORY_PORT:?}:${INVENTORY_PORT:?}"
    mem_limit: ${INVENTORY_MEMORY_LIMIT:?}
    cpus: ${INVENTORY_CPU_LIMIT:?}
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
volumes:
  n8n_data:
  inventory_data:
