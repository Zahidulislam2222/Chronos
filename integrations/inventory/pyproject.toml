[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos-inventory"
version = "0.1.0"
description = "Authenticated inventory staging and social review queue for Chronos"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "pydantic==2.14.0", "python-dotenv==1.2.4"]

[project.scripts]
chronos-inventory = "chronos_inventory.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src/chronos_inventory"]

[tool.pytest.ini_options]
testpaths = ["ci_tests"]
pythonpath = ["src"]
